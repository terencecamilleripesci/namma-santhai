     Safari view where navigator.standalone stays false (install prompt never hides) -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Noto+Sans:wght@400;600;700;800&family=Noto+Sans+Tamil:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* Critical, inlined so the first paint is already the brand - the external
   stylesheet and the fonts are render-blocking, and without this the user
   gets a white flash before anything appears. */
html{background:#f6f1e7;}
html,body{margin:0;padding:0;background:#f6f1e7;}
#splash{position:fixed;inset:0;z-index:9999;background:#f6f1e7;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
  transition:opacity .42s ease, visibility .42s ease;}
#splash.gone{opacity:0;visibility:hidden;pointer-events:none;}
#splash .sp-halo{position:relative;width:150px;height:150px;display:flex;
  align-items:center;justify-content:center;}
#splash .sp-halo::before{content:"";position:absolute;inset:0;border-radius:50%;
  background:radial-gradient(circle,rgba(201,153,43,.30) 0%,rgba(201,153,43,.10) 46%,transparent 68%);
  animation:sp-halo 2.6s ease-in-out infinite;}
#splash img{width:104px;height:104px;border-radius:30px;display:block;position:relative;
  box-shadow:0 10px 26px rgba(15,79,44,.30);
  animation:sp-in 680ms cubic-bezier(.2,.9,.25,1.12) both;}
#splash .sp-name{font:800 23px/1.1 "Playfair Display",Georgia,serif;letter-spacing:2.4px;
  color:#0f4f2c;animation:sp-up 560ms ease-out 180ms both;}
#splash .sp-ta{font:700 14px/1 system-ui,sans-serif;color:#c9992b;
  animation:sp-up 560ms ease-out 280ms both;}
#splash .sp-bar{width:104px;height:3px;border-radius:2px;background:#e3dccd;overflow:hidden;
  animation:sp-up 560ms ease-out 360ms both;}
#splash .sp-bar i{display:block;height:100%;width:40%;border-radius:2px;background:#15663a;
  animation:sp-slide 1.1s ease-in-out infinite;}
@keyframes sp-in{from{opacity:0;transform:scale(.72) translateY(12px);}to{opacity:1;transform:none;}}
@keyframes sp-up{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
@keyframes sp-halo{0%,100%{transform:scale(.92);opacity:.7;}50%{transform:scale(1.08);opacity:1;}}
@keyframes sp-slide{0%{transform:translateX(-120%);}100%{transform:translateX(320%);}}
@media (prefers-reduced-motion:reduce){
  #splash img,#splash .sp-name,#splash .sp-ta,#splash .sp-bar,
  #splash .sp-halo::before,#splash .sp-bar i{animation:none!important;}
}
</style>
<link rel="stylesheet" href="css/styles.css?v=29">
</head>
<body>


<div id="splash" role="status" aria-label="Loading Namma Santhai">
  <div class="sp-halo"><img src="assets/logo-badge.png" alt="" width="104" height="104"></div>
  <div class="sp-name">NAMMA SANTHAI</div>
  <div class="sp-ta">&#2984;&#2990;&#3021;&#2990; &#2970;&#2984;&#3021;&#2980;&#3016;</div>
  <div class="sp-bar"><i></i></div>
</div>

<div class="app" role="application" aria-label="Namma Santhai">
  <main class="viewport" id="app" aria-live="polite"><!-- rendered by app.js --></main>

  <nav class="bottomnav" id="bottomnav" hidden aria-label="Primary"></nav>

  <div class="prompt-bar" id="install-bar" hidden>
    <span class="pb-ic" id="ib-icon" aria-hidden="true"></span>
    <span class="pb-t"><b id="ib-title">Install Namma Santhai</b><span id="ib-sub">Add it to your home screen</span></span>
    <button class="btn btn-primary sm" id="install-btn">Install</button>
    <button class="pb-x" id="install-x" aria-label="Dismiss"></button>
  </div>

  <div class="prompt-bar" id="notif-ask" hidden>
    <span class="pb-ic" id="na-icon" aria-hidden="true"></span>
    <span class="pb-t"><b id="na-title">Turn on notifications</b><span id="na-sub"></span></span>
    <button class="btn btn-primary sm" id="notif-allow">Allow</button>
    <button class="pb-x" id="notif-later" aria-label="Not now"></button>
  </div>

  <div id="sheet-host" hidden></div>

  <div class="toast" id="toast" role="status"></div>
</div>

<script src="js/api.js?v=29"></script>
<script src="js/app.js?v=29"></script>
</body>
</html>
