<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<body>

<p class="stage-hint">Namma Santhai — live trial. <b>Real accounts and real listings</b>, shared between devices. Sign in with a mobile number (no password). New ads appear once approved.</p>

<div class="phone" role="application" aria-label="Namma Santhai app">
  <div class="statusbar">
    <span>9:41</span>
    <span class="sb-right">▮▮▮ · Wi-Fi · 86%</span>
  </div>

  <main class="viewport" id="app" aria-live="polite"><!-- rendered by app.js --></main>

  <nav class="bottomnav" id="bottomnav" hidden aria-label="Primary"></nav>

  <div class="install-bar" id="install-bar" hidden>
    <span class="ib-icon" aria-hidden="true">📲</span>
    <span class="ib-text"><b id="ib-title">Install Namma Santhai</b><br><span id="ib-sub">Add it to your home screen</span></span>
    <button class="btn-primary ib-btn" id="install-btn">Install</button>
    <button class="ib-x" id="install-x" aria-label="Dismiss">✕</button>
  </div>

  <div class="install-bar" id="notif-ask" hidden style="bottom:92px">
    <span class="ib-icon" aria-hidden="true">🔔</span>
    <span class="ib-text"><b id="na-title">Turn on notifications</b><br><span id="na-sub"></span></span>
    <button class="btn-primary ib-btn" id="notif-allow">Allow</button>
    <button class="ib-x" id="notif-later" aria-label="Not now">✕</button>
  </div>

  <div class="toast" id="toast" role="status"></div>
</div>

<script src="js/api.js?v=11"></script>
<script src="js/app.js?v=11"></script>
</body>
