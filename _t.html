<!DOCTYPE html><html><head><meta charset="utf-8"><title>PENDING</title></head><body>
<iframe id="f" src="index.html" style="width:390px;height:844px;border:0"></iframe><pre id="log"></pre>
<script>
const R=[];const ok=(n,c,x)=>R.push((c?"PASS ":"FAIL ")+n+(x?" ["+x+"]":""));
const f=document.getElementById('f');let d,w,$;
const S=ms=>new Promise(r=>setTimeout(r,ms));
function setup(){d=f.contentDocument;w=f.contentWindow;$=s=>d.querySelector(s);}
function click(s){const e=$(s);if(e){e.click();return true}return false}
function type(s,v){const e=$(s);if(!e)return false;e.value=v;
 e.dispatchEvent(new w.Event('input',{bubbles:true}));e.dispatchEvent(new w.Event('change',{bubbles:true}));return true}
f.addEventListener('load',()=>setTimeout(run,2500));
async function pick(){
  const cv=d.createElement('canvas'); cv.width=cv.height=1800;      // big, like a camera
  const cx=cv.getContext('2d'); cx.fillStyle='#8d7a5b'; cx.fillRect(0,0,1800,1800);
  cx.fillStyle='#fff'; cx.font='120px sans-serif'; cx.fillText('GOAT',700,900);
  const blob=await new Promise(r=>cv.toBlob(r,'image/jpeg',0.95));
  const file=new w.File([blob],'goat.jpg',{type:'image/jpeg'});
  const dt=new w.DataTransfer(); dt.items.add(file);
  const inp=$('#photo-file'); inp.files=dt.files;
  inp.dispatchEvent(new w.Event('change',{bubbles:true}));
}
async function run(){
 try{
  setup();
  // --- NORMAL user must NOT be able to fake admin ---
  click('[data-go="phone"]'); await S(600); setup();
  type('#phone','97'+Math.floor(10000000+Math.random()*89999999)); type('#signin-name','Normal User');
  click('#send-otp'); await S(2500); setup();
  click('[data-go="myprofile"]'); await S(600); setup();
  click('[data-go="settings"]'); await S(800); setup();
  ok("NO-FAKE-ADMIN-SWITCH", $('[data-admin]')===null, "local toggle must be gone in live mode");
  ok("explains-admin-by-number", /number/i.test(d.body.textContent));
  ok("no-queue-for-normal-user", $('[data-go="admin"]')===null);

  // --- photo upload with a BIG image (quota + downscale path) ---
  click('[data-go="myprofile"]'); await S(700); setup();
  click('[data-go="home"]'); await S(1200); setup();
  click('[data-go="post"]'); await S(1000); setup();
  ok("on-post-form", $('#photo-file')!==null);
  type('#d-title','Admin Flow Goat'); type('#d-price','18800');
  type('#d-desc','Checking photo save and approval.');
  await pick(); await S(4000); setup();
  ok("PHOTO-ATTACHED", $('#photo-add img')!==null || d.querySelectorAll('.photo-slot').length>1,
     'slots='+d.querySelectorAll('.photo-slot').length+' imgs='+d.querySelectorAll('#photo-add img').length);
  click('#d-manual'); await S(400); setup();
  type('#d-district','Madurai'); type('#d-village','Melur');
  click('#post-next'); await S(500); setup();
  click('#submit-ad'); await S(3000); setup();
  click('[data-go="home"]'); await S(2500); setup();
  ok("PHOTO-SAVED-ON-SERVER", d.querySelector('.grid2 .media img')!==null
      && /nsapi\/api\/media/.test(d.querySelector('.grid2 .media img').src),
      (d.querySelector('.grid2 .media img')||{}).src||'none');

  // --- now sign in as the REAL admin and approve ---
  click('[data-go="myprofile"]'); await S(800); setup();
  click('#logout'); await S(1500); setup();
  click('[data-go="phone"]'); await S(600); setup();
  type('#phone','9843575561'); type('#signin-name','Admin');
  click('#send-otp'); await S(2500); setup();
  click('[data-go="myprofile"]'); await S(700); setup();
  click('[data-go="settings"]'); await S(900); setup();
  ok("ADMIN-SEES-QUEUE-LINK", $('[data-go="admin"]')!==null);
  click('[data-go="admin"]'); await S(2000); setup();
  ok("queue-has-item", d.querySelectorAll('.admin-card').length>=1,
     d.querySelectorAll('.admin-card').length+" cards");
  click('[data-approve]'); await S(2500); setup();
  ok("APPROVE-WORKED", d.querySelectorAll('.admin-card').length===0
      || !/Admin Flow Goat/.test(d.body.textContent));
  // admin -> settings -> profile -> home (no direct home link on those screens)
  click('[data-go="settings"]'); await S(900); setup();
  click('[data-go="myprofile"]'); await S(900); setup();
  click('[data-go="home"]'); await S(3000); setup();
  ok("NOW-PUBLIC", /Admin Flow Goat/.test(d.body.textContent));
  ok("no-pending-badge", d.querySelector('.grid2 .status.pending')===null);
 }catch(e){R.push("FAIL "+e.message);}
 const fa=R.filter(r=>r.startsWith("FAIL"));
 document.getElementById('log').textContent=R.join("\n");
 document.title=(R.length&&!fa.length)?"ALLPASS("+R.length+")":"HASFAIL "+fa.join(" | ");
}
</script></body></html>
