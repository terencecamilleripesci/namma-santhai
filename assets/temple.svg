<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 300" preserveAspectRatio="xMidYMax slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6e9c8"/><stop offset="1" stop-color="#f1dca6"/>
    </linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cdb98f"/><stop offset="1" stop-color="#b59c6d"/>
    </linearGradient>
  </defs>
  <rect width="390" height="300" fill="url(#sky)"/>
  <!-- simple Tamil gopuram silhouette -->
  <g fill="url(#stone)" opacity="0.9">
    <polygon points="195,20 150,80 240,80"/>
    <rect x="150" y="80" width="90" height="26"/>
    <polygon points="195,96 135,150 255,150"/>
    <rect x="135" y="150" width="120" height="30"/>
    <polygon points="195,166 118,230 272,230"/>
    <rect x="118" y="230" width="154" height="70"/>
    <rect x="178" y="250" width="34" height="50" fill="#8a7147"/>
  </g>
  <g fill="#a98f62" opacity="0.5">
    <rect x="30" y="200" width="70" height="100"/><polygon points="65,170 30,200 100,200"/>
    <rect x="290" y="200" width="70" height="100"/><polygon points="325,170 290,200 360,200"/>
  </g>
</svg>
